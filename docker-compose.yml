services:
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: ad-visor-api
    ports:
      - ${SERVER_PORT}:${SERVER_PORT}
      - "5005:5005"
    env_file:
      - .env
    networks:
      - ad-visor-network

networks:
  ad-visor-network:
    driver: bridge
